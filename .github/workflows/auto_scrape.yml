name: Auto Scrape Bigg Boss Episodes

on:
  schedule:
    # Runs every 20 minutes during episode release window (11:00 PM IST to 2:50 AM IST)
    - cron: "30,50 17 * * *"
    - cron: "*/20 18-20 * * *"
    - cron: "10,30,50 21 * * *"
    # Morning fallback run at 11:00 AM IST in case upload was delayed overnight
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force scrape even outside night window or if today's episode is already found"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Scraper Pipeline
        run: |
          FLAGS="--no-sizes"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python pipeline_scraper.py $FLAGS

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          if git diff --staged --quiet; then
            echo "No new episodes found. Everything is up to date."
          else
            git commit -m "chore: auto-update episodes from pipeline [skip ci]"
            git push origin main
          fi
