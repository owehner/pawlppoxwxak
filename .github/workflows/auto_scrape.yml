name: Auto Scrape Bigg Boss Episodes

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Scraper Pipeline
        run: |
          python pipeline_scraper.py --no-push

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          if git diff --staged --quiet; then
            echo "No new episodes found. Everything is up to date."
          else
            git commit -m "chore: auto-update episodes from pipeline [skip ci]"
            git push origin main
          fi
